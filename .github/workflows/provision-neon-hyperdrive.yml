name: Provision isolated Cloudflare staging Hyperdrive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-hyperdrive-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Create a new isolated staging Hyperdrive (never modify existing configs)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.CLOUDFLARE_STAGING_DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const required = ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'STAGING_DATABASE_URL'];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length) {
            console.error('Missing cloudflare-staging environment secrets: ' + missing.join(', '));
            process.exit(1);
          }

          const url = new URL(process.env.STAGING_DATABASE_URL);
          const host = url.hostname.toLowerCase();
          const user = decodeURIComponent(url.username);
          const database = decodeURIComponent(url.pathname.slice(1));

          if (!['postgres:', 'postgresql:'].includes(url.protocol) ||
              !host.endsWith('.neon.tech') ||
              host !== 'ep-fragrant-cherry-bezpjtkr.c-9.us-east-2.aws.neon.tech' ||
              host.includes('-pooler') ||
              host.includes('ep-wispy-night-bexu4b47') ||
              host.includes('ep-jolly-dust-bep7yrxv') ||
              database !== 'neondb' ||
              user !== 'hyperdrive_user' ||
              !url.password) {
            throw new Error('Refusing provisioning: provide a dedicated direct Neon staging endpoint using database neondb and role hyperdrive_user. Production and the known safety branch are blocked.');
          }

          const base = 'https://api.cloudflare.com/client/v4/accounts/' +
            encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID) + '/hyperdrive/configs';
          const headers = {
            Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type': 'application/json'
          };

          async function api(path, options = {}) {
            const response = await fetch(base + path, { ...options, headers });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              const details = (body.errors || []).map((e) => e.message).join('; ');
              throw new Error('Cloudflare API rejected the request (' + response.status + '): ' + (details || 'unknown error'));
            }
            return body.result;
          }

          (async () => {
            const configs = await api('?per_page=100');
            const name = 'boss-bot-platform-staging-neon-primary';
            if ((configs || []).some((item) => item.name === name)) {
              throw new Error('A config with the dedicated staging name already exists. No existing config was modified; inspect it manually before proceeding.');
            }

            const created = await api('', {
              method: 'POST',
              body: JSON.stringify({
                name,
                origin: {
                  database,
                  host,
                  password: decodeURIComponent(url.password),
                  port: Number(url.port || 5432),
                  scheme: 'postgres',
                  user
                },
                caching: { disabled: true },
                origin_connection_limit: 5
              })
            });

            if (!created || !created.id) throw new Error('Cloudflare did not return a Hyperdrive ID.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'hyperdrive_id=' + created.id + '\n');
            console.log('New staging Hyperdrive ID: ' + created.id);
            console.log('Created a new isolated staging Hyperdrive configuration.');
            console.log('No existing config was patched. No Worker was deployed. No webhook or database migration was performed.');
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
